name: Profile Stats

# Renders the static metrics card the README shows (github-metrics.svg, via
# lowlighter/metrics) and publishes it to the `output` branch next to snake.svg.
#
# It goes to `output`, not `main`, on purpose: the previous version of this
# workflow committed to main twice a day, and that bot noise made up most of
# the visible commit history (removed in #152). The README reads the file
# from raw.githubusercontent.com/.../output/, so main stays clean.
#
# A top-languages card used to be rendered here too. It was removed because it
# only counts public repos, which are mostly exported HTML pages, so it showed
# "HTML 93%" and misrepresented the stack the README's badges already list.

on:
  schedule:
    # :30, offset from snake.yml's 00:00 run and the busy top-of-hour slot.
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml

permissions:
  contents: write          # needed to push to the output branch

# Shared with snake.yml so two publishers never push to `output` at once.
concurrency:
  group: profile-output-branch
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Do NOT give this step an `id:`. The action reads `github.action` (which
      # becomes the step id when one is set) to decide whether it is the
      # official action; with an id it treats itself as a fork, skips the
      # pre-built image and rebuilds from its Dockerfile, which currently
      # fails. Failure is detected from the rendered file instead (below).
      - name: Generate github-metrics.svg
        continue-on-error: true
        timeout-minutes: 10
        uses: lowlighter/metrics@latest
        with:
          # Prefers a repo secret named METRICS_TOKEN (a read-only GitHub PAT)
          # for complete data, but falls back to the built-in GITHUB_TOKEN so
          # the workflow works with zero extra setup for public stats.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ahmedfarid2
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Dubai
          # Render only; the publish step below does the push.
          output_action: none

      - name: Collect github-metrics.svg
        id: collect
        run: |
          mkdir -p dist
          if [ -f /metrics_renders/github-metrics.svg ]; then
            cp /metrics_renders/github-metrics.svg dist/
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::github-metrics.svg was not rendered; the previous copy on output (if any) stays."
            echo "rendered=false" >> "$GITHUB_OUTPUT"
          fi

      # keep_files: only the files in dist/ are replaced; snake.svg stays as
      # it is on the branch. An empty dist/ makes this a no-op.
      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "chore(stats): refresh profile stat cards"

      # continue-on-error keeps the run green, so a card that stops rendering
      # (e.g. an expired METRICS_TOKEN) would freeze silently. Fail the run
      # after publishing so GitHub sends the usual failure email.
      - name: Fail if the card did not render
        if: steps.collect.outputs.rendered != 'true'
        run: |
          echo "::error::github-metrics.svg did not render; see the Generate step's log."
          exit 1
